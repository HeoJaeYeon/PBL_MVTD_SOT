DATA:
  MAX_SAMPLE_INTERVAL: 200
  MAX_JUMP: 70
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    SIZE: 384
    NUMBER: 5
    CENTER_JITTER: 4.5
    FACTOR: 5.0
    SCALE_JITTER: 0.5
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    SIZE: 192
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
  TRAIN:
    DATASETS_NAME:
    - GOT10K_train_full
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000
#  VAL:
#    DATASETS_NAME:
#    - GOT10K_official_val
#    DATASETS_RATIO:
#    - 1
#    SAMPLE_PER_EPOCH: 10000
MODEL:
  NEW_HIP: True
  # PRETRAIN_FILE: "DropTrack_k700_800E_got10k.pth.tar"
  PRETRAIN_FILE: "DropTrack_k700_800E_alldata.pth.tar"  
  # PRETRAIN_FILE: ""
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'  # choose between ALL, CTR_POINT, CTR_REC, GT_BOX
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
TRAIN:
  # focal loss (location) hyper-parameters
  FOCAL_ALPHA: 2
  FOCAL_BETA: 4
  FOCAL_WEIGHT: 1.0
  # target-background contrast loss on the head input feature (0 = off)
  CONTRAST_WEIGHT: 0.1
  CONTRAST_TAU: 0.1
  # scale-aware giou/l1 weighting by original-image target size (pixels)
  SCALE_AWARE_LOSS: True
  SCALE_REF_PX: 64.0
  SCALE_GAMMA: 1.0
  SCALE_W_MAX: 3.0
  SCALE_NORMALIZE: True
  #
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 64
  EPOCH: 20
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 80
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 100
  WEIGHT_DECAY: 0.0001
  AMP: False
TEST:
  EPOCH: 13
  SEARCH_FACTOR: 5.0
  SEARCH_SIZE: 384
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 192
